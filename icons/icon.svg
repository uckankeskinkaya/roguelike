<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#1b1240"/>
      <stop offset="1" stop-color="#05060c"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#ff5ad1"/>
      <stop offset="1" stop-color="#ff5ad1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g filter="url(#glow)" fill="none" stroke-linecap="round">
    <circle cx="256" cy="256" r="150" stroke="#4df0ff" stroke-width="18" stroke-dasharray="150 40"/>
    <circle cx="256" cy="256" r="104" stroke="#4df0ff" stroke-opacity="0.5" stroke-width="8" stroke-dasharray="60 30"/>
  </g>
  <circle cx="256" cy="256" r="92" fill="url(#core)"/>
  <ellipse cx="256" cy="256" rx="16" ry="40" fill="#05060c"/>
  <g fill="#ffd23f" filter="url(#glow)">
    <circle cx="410" cy="150" r="12"/>
    <circle cx="112" cy="380" r="10"/>
    <circle cx="380" cy="400" r="8"/>
  </g>
</svg>
